name: Hinge Real Photo A/B (research)

on:
  push:
    branches: [study/hinge-real-photo-ab-20261019]
  workflow_dispatch:

concurrency:
  group: hinge-reference-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check research scripts before downloading or building
        run: |
          node --check integrations/hinge_lab/package_single_file.mjs
          node --check integrations/hinge_lab/test_single_file.mjs
          node --check integrations/hinge_lab/build_and_test.mjs
          node --check integrations/hinge_lab/app.mjs
          node --check forge/tests/hinge_sweep_collision.mjs
          node --check forge/tests/hinge_photo_frame_fit.mjs
          node --check forge/tests/test_hinge_photo_frame_fit.mjs
          node --test forge/tests/test_hinge_photo_frame_fit.mjs
          node --check forge/tests/hinge_photo_color_sensitivity.mjs
          node --test forge/tests/test_hinge_photo_color_sensitivity.mjs
          node --check forge/tests/hinge_photo_ab.mjs
      - name: Obtain credited reference photograph, not a mesh or art pack
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            --user-agent "img2threejs-reference-evaluation/1.0 (+https://github.com/kvnloo/img2threejs)" \
            https://upload.wikimedia.org/wikipedia/commons/e/eb/Box.agr.jpg \
            --output "$RUNNER_TEMP/box.agr.jpg"
          test "$(wc -c < "$RUNNER_TEMP/box.agr.jpg")" -gt 25000
          printf '%s  %s\n' \
            '385f42408d114bad1cfc06adf773a64b1902779c9a4515da07413fbac0a13530' \
            "$RUNNER_TEMP/box.agr.jpg" | sha256sum -c -
      - name: Install pinned test-only Three.js/browser dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            three@0.180.0 @types/three@0.180.0 \
            typescript@5.9.3 esbuild@0.25.12 playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Reject false-clean endpoints with an adversarial sweep
        env:
          HINGE_SWEEP_OUTPUT: ${{ runner.temp }}/hinge-photo-ab/sweep-negative-control.json
        run: |
          mkdir -p "$RUNNER_TEMP/hinge-photo-ab"
          node --test forge/tests/test_hinge_sweep_collision.mjs
      - name: Run real-photo A/B and mechanical seam assertions
        env:
          HINGE_REFERENCE_PHOTO: ${{ runner.temp }}/box.agr.jpg
          HINGE_AB_OUTPUT: ${{ runner.temp }}/hinge-photo-ab
        run: node forge/tests/hinge_photo_ab.mjs
      - name: Build and test offline interactive hinge lab
        env:
          HINGE_REFERENCE_PHOTO: ${{ runner.temp }}/box.agr.jpg
          HINGE_LAB_OUTPUT: ${{ runner.temp }}/hinge-lab-offline
        run: node integrations/hinge_lab/build_and_test.mjs
      - name: Package and test single-file offline Hinge Lab
        env:
          HINGE_LAB_OUTPUT: ${{ runner.temp }}/hinge-lab-offline
        run: |
          node integrations/hinge_lab/package_single_file.mjs
          node integrations/hinge_lab/test_single_file.mjs
      - name: Upload credited comparison and measured raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hinge-real-photo-ab
          path: ${{ runner.temp }}/hinge-photo-ab/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload offline interactive lab and browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hinge-lab-offline
          path: ${{ runner.temp }}/hinge-lab-offline/
          if-no-files-found: warn
          retention-days: 14
