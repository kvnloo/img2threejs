name: Print STL independent-import smoke

on:
  pull_request:
    paths:
      - 'forge/stage3_build/print_export.py'
      - 'scripts/print_export_openscad_smoke.py'
      - '.github/workflows/print-export-openscad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openscad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install independent geometry consumer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Round-trip emitted binary STL through OpenSCAD
        run: python3 scripts/print_export_openscad_smoke.py
