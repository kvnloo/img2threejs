name: Capture resume real-browser smoke

on:
  pull_request:
    paths:
      - 'scripts/capture_threejs_playwright.py'
      - 'scripts/test_capture_resume_browser.py'
      - 'forge/tests/fixtures/capture_resume.html'
      - '.github/workflows/capture-resume-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated optional browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/img2-browser-deps"
          npm install --prefix "$RUNNER_TEMP/img2-browser-deps" --no-audit --no-fund --no-save three@0.180.0
      - name: Exercise real Chromium capture interruption and resume
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_capture_resume_browser.py \
            --three-root "$RUNNER_TEMP/img2-browser-deps/node_modules/three" \
            --out "$RUNNER_TEMP/img2-capture-resume-evidence"
      - name: Publish replay logs, screenshots and evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-resume-browser-evidence
          path: ${{ runner.temp }}/img2-capture-resume-evidence/
          if-no-files-found: ignore
          retention-days: 7
